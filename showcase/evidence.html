<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Why this is phishing: cue evidence</title>
<style>
  :root{ --ground:#f1f3f4; --card:#fff; --ink:#202124; --muted:#5f6368; --line:#dadce0; --blue:#1a73e8; }
  @media (prefers-color-scheme:dark){ :root{ --ground:#202124; --card:#2d2e31; --ink:#e8eaed; --muted:#9aa0a6; --line:#5f6368; --blue:#8ab4f8; } }
  *{box-sizing:border-box}
  body{margin:0; background:var(--ground); color:var(--ink); font-family:-apple-system,"Segoe UI",Roboto,Arial,sans-serif}
  main{max-width:820px; margin:0 auto; padding:24px 16px 60px}
  .nav{display:flex; gap:6px; flex-wrap:wrap; margin-bottom:14px}
  .nav a{font-size:.85rem; color:var(--muted); text-decoration:none; padding:5px 12px; border-radius:16px; border:1px solid var(--line)}
  .nav a.active{background:var(--blue); color:#fff; border-color:var(--blue)}
  .ctl{display:flex; justify-content:space-between; align-items:center; margin-bottom:10px; font-size:.9rem}
  button{background:var(--blue); color:#fff; border:none; border-radius:16px; padding:8px 16px; cursor:pointer; font-size:.9rem}
  .card{background:var(--card); border:1px solid var(--line); border-radius:12px; padding:20px 22px; margin-bottom:14px}
  .verdict{font-size:.98rem; font-weight:600; color:#c62828; margin-bottom:12px}
  .mailhdr{display:flex; gap:12px; align-items:center; border-bottom:1px solid var(--line); padding-bottom:12px; margin-bottom:14px}
  .avatar{width:38px; height:38px; border-radius:50%; background:#8e8e93; color:#fff; display:flex; align-items:center; justify-content:center; font-weight:600; flex:none}
  .from{font-size:.92rem; word-break:break-all}
  .from .addr{color:var(--muted)}
  .subj{font-size:1.15rem; font-weight:600; margin:0 0 12px}
  .body{white-space:pre-wrap; line-height:1.65; font-size:.95rem}
  .hl{border-radius:4px; padding:1px 3px; border-bottom:2px solid; cursor:help}
  .c-urgency{background:#ffe0b2; border-color:#e65100}
  .c-threats{background:#ffcdd2; border-color:#c62828}
  .c-generic_greeting{background:#e1bee7; border-color:#6a1b9a}
  .c-spelling_grammar{background:#fff59d; border-color:#f9a825}
  .c-emotional_appeal{background:#f8bbd0; border-color:#ad1457}
  .c-too_good_true{background:#c8e6c9; border-color:#2e7d32}
  .c-personal_info{background:#b3e5fc; border-color:#0277bd}
  .c-suspicious_sender{background:#d7ccc8; border-color:#4e342e}
  .c-suspicious_link{background:#ffccbc; border-color:#bf360c}
  .legend{display:flex; gap:8px; flex-wrap:wrap}
  .chip{font-size:.82rem; padding:4px 10px; border-radius:14px; border:1px solid transparent}
  .chip.nf{opacity:.65; border:1px dashed var(--muted); background:none; color:var(--muted)}
  .small{font-size:.85rem; color:var(--muted); margin:10px 0 0}
</style>
</head>
<body>
<main>
  <nav class="nav">
    <a href="index.html">Results Summary</a>
    <a href="report.html">Full Report</a>
    <a href="evidence.html" class="active">Why it is phishing</a>
    <a href="mock_landing_page.html">Phishing Demo</a>
    <a href="quiz.html">Phishing Quiz</a>
  </nav>
  <div class="ctl"><span id="counter">Loading</span><button id="next">Next email</button></div>
  <div class="card">
    <div class="verdict" id="verdict"></div>
    <div class="mailhdr"><div class="avatar" id="avatar"></div><div class="from" id="from"></div></div>
    <div class="subj" id="subj"></div>
    <div class="body" id="body"></div>
  </div>
  <div class="card">
    <div class="legend" id="legend"></div>
    <p class="small">Each coloured span is text the model flagged as a red-flag cue. Hover a span for the cue name. Dashed chips are cues the model flagged that have no single phrase in the text.</p>
  </div>
</main>
<script>
(function(){
  var CUES = {
    urgency:'Pressure to act now', threats:'Threatens a consequence', generic_greeting:'Impersonal greeting',
    spelling_grammar:'Spelling or grammar problem', emotional_appeal:'Emotional pull', too_good_true:'Too-good-to-be-true offer',
    personal_info:'Asks for sensitive details', suspicious_sender:'Sender looks mismatched', suspicious_link:'Link looks suspicious'
  };
  // Patterns that locate each cue in the text. A cue with no match is listed, not hidden.
  var PAT = {
    urgency: /(act now|immediately|urgent(ly)?|today|within \d+ (hours?|days?)|as soon as possible|right away|expires?)/i,
    threats: /(suspend\w*|closed|blocked|terminat\w*|legal action|penalt\w*|lose access|will be removed|disabled|consequences?)/i,
    generic_greeting: /^(dear [^,\n]{1,40}|hello [^,\n]{1,40}|hi there|to whom it may concern)/im,
    spelling_grammar: /\b(recieve\w*|verfy|acount|pls|dont|seperate|occured|untill|wich)\b/i,
    emotional_appeal: /(congratulations|you('ve| have) been selected|urgent plea|please help|we are sorry|don'?t miss)/i,
    too_good_true: /(free|prize|reward|bonus|guaranteed|winner|lottery|gift card)/i,
    personal_info: /(password|credentials|verify your|bank (account|details)|social security|account details|confirm your (identity|details|login))/i
  };
  var items = [], i = 0;
  function $(id){ return document.getElementById(id); }
  function esc(s){ return String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;'); }

  function bodyHtml(it){
    var text = String(it.body), spans = [];
    (it.cues || []).forEach(function(c){
      if(c === 'suspicious_link'){
        var u = /https?:\/\/[^\s<>"']+/i.exec(text);
        if(u) spans.push({s:u.index, e:u.index + u[0].length, c:c});
        return;
      }
      var m = PAT[c] && PAT[c].exec(text);
      if(m) spans.push({s:m.index, e:m.index + m[0].length, c:c});
    });
    spans.sort(function(a,b){ return a.s - b.s; });
    var out = '', pos = 0, used = [];
    spans.forEach(function(sp){
      if(sp.s < pos) return;
      out += esc(text.slice(pos, sp.s)) + '<span class="hl c-' + sp.c + '" title="' + esc(CUES[sp.c]) + '">' +
             esc(text.slice(sp.s, sp.e)) + '</span>';
      pos = sp.e; used.push(sp.c);
    });
    out += esc(text.slice(pos));
    return {html: out, used: used};
  }

  function render(it){
    var b = bodyHtml(it), cues = it.cues || [];
    var addr = String(it.sender);
    var m = /^\s*"?([^"<]*?)"?\s*<([^>]+)>/.exec(addr);
    var name = m ? m[1].trim() : addr.split('@')[0];
    var mail = m ? m[2] : addr;
    var senderHl = cues.indexOf('suspicious_sender') >= 0;
    $('avatar').textContent = (name.charAt(0) || '?').toUpperCase();
    $('from').innerHTML = (senderHl
        ? '<span class="hl c-suspicious_sender" title="' + esc(CUES.suspicious_sender) + '">' + esc(name) + '</span>'
        : esc(name)) + ' <span class="addr">&lt;' + esc(mail) + '&gt;</span>';
    $('subj').textContent = it.subject;
    $('body').innerHTML = b.html;
    $('counter').textContent = 'Phishing email ' + (i + 1) + ' of ' + items.length + ' (source: ' + it.source + ')';
    var chips = '';
    cues.forEach(function(c){
      var located = b.used.indexOf(c) >= 0 || (c === 'suspicious_sender' && senderHl);
      chips += located
        ? '<span class="chip c-' + c + '">' + esc(CUES[c] || c) + '</span>'
        : '<span class="chip nf">' + esc(CUES[c] || c) + ' (no phrase located)</span>';
    });
    $('legend').innerHTML = chips || '<span class="chip nf">No text cues detected: the link is the only signal</span>';
    $('verdict').textContent = 'Phishing: ' + (cues.length
      ? cues.length + ' red-flag cue' + (cues.length === 1 ? '' : 's') + ' detected by the model'
      : 'no text cues, the link is the only signal');
  }

  $('next').addEventListener('click', function(){ i = (i + 1) % items.length; render(items[i]); });
  fetch('evidence_items.json').then(function(r){ return r.json(); }).then(function(d){
    items = d; if(items.length) render(items[0]);
  }).catch(function(){ $('counter').textContent = 'Could not load the emails.'; });
})();
</script>
</body>
</html>
